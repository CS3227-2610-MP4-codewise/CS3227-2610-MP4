schema: spec-driven

context: |
  Codewise is a proposed programming education application for NUS CS3227 MP4.
  Status: MVP product baseline remains draft; verified foundation is deployed.
  Confirmed team: Darryl owns instructor features; Keith owns student features.
  Updated ownership requested by Darryl on 2026-11-06: Darryl owns shared sign-in,
  registration/provisioning, provider accounts, sessions/logout and CSRF (SH-AUTH),
  plus publication, assessment/release, AI gateway and operations. Keith retains
  submissions and student features. Darryl also owns courses, memberships, object
  authorization and workspace contexts (SH-ID), transferred on 2026-11-07.
  Both review the composed C-ID boundary; Keith's revised-boundary review is pending.
  One authoritative identity store; serialize shared schema/API edits. Darryl approved
  Firebase Authentication with Gmail-delivered generated proof links for invitation-only onboarding in shared-authentication on 2026-11-06.
  This supersedes earlier Google/SendGrid/Brevo targets; Native-mail template edits were rejected; Darryl selected an alternate sender and retained in-app password forms on2026-11-07. User reports credentials entered; live verification is pending. Public registration and instructor self-promotion are not approved. Live Firebase credentials/Gmail delivery,
  Keith's revised-boundary review and composed authorization remain pending.
  Cloudflare foundation staging/production passed run 41799944040 at 281cc13;
  role features remain separate work. See workflow/Ownership.md and evidence.
  Working assumptions: one language (Python),
  one source file per question, no student-code execution or automatic test grading.
  Required LLM provider: SoCLaaS, accessed only through the backend.
  Foundation host: Cloudflare Workers with static assets and D1. Full-product
  capacity and AI activation remain gated on measured CPU/latency, authenticated
  provider connectivity, supported models and verified quotas.
  Never invent provider quotas, available models, credentials, or test outcomes.
  OpenSpec artifacts live in openspec/; development coordination records in workflow/;
  implementation in src/; guides and reflections in docs/; member summaries in
  logs/darryl/ and logs/keith/. Shared verification belongs in workflow/evidence/.
  Preserve immutable submission, question, rubric, prompt, and assessment versions.
  Each AI output is untrusted and must be validated. Instructor approval precedes release.
  Application UI follows docs/ui/design.md revision warm-workbook-v1: Workbook
  layout with Margin palette, proportional interface text and monospaced code.
  Read warm-workbook-ui UI-01–UI-08 for sign-in, trusted conditional role switching,
  versioned work, Previous/Next navigation, source observations and accessible states.
  The shared visual foundation is applied to the public foundation screen;
  shared-authentication implements local sign-in/session/invitation behavior with
  revised Firebase credentials/Gmail delivery implementation and real provider verification pending. Role workspaces still await
  their reviewed producer handoffs. Client roles never grant privileges.

rules:
  proposal:
    - State assumptions, exclusions, and unresolved decisions explicitly.
    - For application UI, cite docs/ui/design.md and applicable UI-01–UI-08 requirements; state affected screens and bounded role ownership.
  specs:
    - Use SHALL requirements and WHEN/THEN scenarios, including failure paths.
    - Include stable requirement IDs for traceability to tests.
  design:
    - Explain authorization, data boundaries, deployment isolation, and resource limits.
    - For application UI, follow warm-workbook-v1 and identify shared tokens, screen/state coverage, keyboard/responsive behavior and any explicitly approved departures.
  tasks:
    - Link implementation and verification tasks to requirement IDs.
    - For application UI, include applicable UI requirement IDs and workflow/templates/ui-review.md evidence; screenshots or mocks do not complete authentication, persistence or deployment tasks.
