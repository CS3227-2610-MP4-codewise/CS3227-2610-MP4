name: Deploy production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Deploy staging run ID to promote
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: codewise-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        id: gate
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        with:
          script: |
            const id = process.env.STAGING_RUN_ID;
            if (!/^[0-9]+$/.test(id)) throw new Error('Use a numeric staging run ID.');
            const { data: run } = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
            const { assertStagingRun } = await import(`${process.env.GITHUB_WORKSPACE}/workflow/scripts/release-gate.mjs`);
            const sha = assertStagingRun(run, context.payload.repository.id);
            core.setOutput('sha', sha);
            await core.summary.addHeading('Verified staging release').addRaw(`Commit: ${sha}; staging run: ${id}`).write();

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_ENV: production
      APP_VERSION: ${{ needs.verify.outputs.sha }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
      PRODUCTION_D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: staging-release-${{ needs.verify.outputs.sha }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.staging_run_id }}
      - name: Verify artifact revision
        run: node -e "const r=JSON.parse(require('fs').readFileSync('dist/release.json')); if(r.sha!==process.env.APP_VERSION) process.exit(1)"
      - run: npm run deploy:prepare
      - name: Apply reviewed production migrations
        run: npx wrangler d1 migrations apply codewise-production --remote --env production --config wrangler.deploy.json
      - name: Deploy tested revision
        run: npx wrangler deploy --env production --config wrangler.deploy.json
      - run: npm run smoke
      - name: Record release
        run: |
          {
            echo "### Production verified"
            echo "- [Open stable production]($APP_URL)"
            echo "- Released commit: $APP_VERSION"
            echo "- Source staging run: $STAGING_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
