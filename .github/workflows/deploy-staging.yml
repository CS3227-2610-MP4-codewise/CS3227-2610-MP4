name: Deploy staging and production

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: codewise-release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_ENV: staging
      APP_VERSION: ${{ github.sha }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
      PRODUCTION_D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: checked-client-${{ github.sha }}
          path: dist/client
      - run: npm run deploy:prepare
      - name: Apply reviewed staging migrations
        run: npx wrangler d1 migrations apply codewise-staging --remote --env staging --config wrangler.deploy.json
      - name: Deploy staging
        run: npx wrangler deploy --env staging --config wrangler.deploy.json
      - run: npm run smoke
      - name: Publish staging link and release instructions
        run: |
          {
            echo "### Staging verified"
            echo "- [Open stable staging]($APP_URL)"
            echo "- Tested commit: $APP_VERSION"
            echo "Production is queued in this same run and waits for your approval."
            echo "Test staging, then click Review deployments > production > Approve and deploy at the top of this run."
            echo "Reject or cancel the run if staging is not ready. No run ID needs to be copied."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record tested commit
        run: node -e "require('fs').writeFileSync('dist/release.json', JSON.stringify({sha:process.env.APP_VERSION,runId:process.env.GITHUB_RUN_ID}))"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ github.sha }}
          path: |
            dist/client
            dist/release.json
          if-no-files-found: error
          retention-days: 14

  production:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_ENV: production
      APP_VERSION: ${{ github.sha }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
      PRODUCTION_D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: staging-release-${{ github.sha }}
          path: dist
      - name: Verify exact staging artifact and current master revision
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { assertReleaseArtifact } = await import(`${process.env.GITHUB_WORKSPACE}/workflow/scripts/release-gate.mjs`);
            const { data: main } = await github.rest.repos.getCommit({...context.repo, ref: 'master'});
            assertReleaseArtifact(JSON.parse(readFileSync('dist/release.json', 'utf8')), {
              sha: context.sha,
              runId: String(context.runId),
              latestMainSha: main.sha,
            });
      - run: npm run deploy:prepare
      - name: Apply reviewed production migrations
        run: npx wrangler d1 migrations apply codewise-production --remote --env production --config wrangler.deploy.json
      - name: Deploy approved revision
        run: npx wrangler deploy --env production --config wrangler.deploy.json
      - run: npm run smoke
      - name: Publish production link
        run: |
          {
            echo "### Production verified"
            echo "- [Open stable production]($APP_URL)"
            echo "- Released commit: $APP_VERSION"
            echo "- Approved staging run: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
