name: Deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codewise-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_ENV: staging
      APP_VERSION: ${{ github.sha }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
      PRODUCTION_D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: checked-client-${{ github.sha }}
          path: dist/client
      - run: npm run deploy:prepare
      - name: Apply reviewed staging migrations
        run: npx wrangler d1 migrations apply codewise-staging --remote --env staging --config wrangler.deploy.json
      - name: Deploy staging
        run: npx wrangler deploy --env staging --config wrangler.deploy.json
      - run: npm run smoke
      - name: Publish staging link and release instructions
        run: |
          {
            echo "### Staging verified"
            echo "- [Open stable staging]($APP_URL)"
            echo "- Tested commit: $APP_VERSION"
            echo "- Production input staging_run_id: $GITHUB_RUN_ID"
            echo "To release, open Actions > Deploy production > Run workflow on main, enter this staging run ID, and approve the production environment."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record tested commit
        run: node -e "require('fs').writeFileSync('dist/release.json', JSON.stringify({sha:process.env.APP_VERSION,runId:process.env.GITHUB_RUN_ID}))"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ github.sha }}
          path: |
            dist/client
            dist/release.json
          if-no-files-found: error
          retention-days: 14
