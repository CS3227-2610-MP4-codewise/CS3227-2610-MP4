<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Keith’s project experiments</title>
  <style>
    :root {
      font:
        100%/1.55 system-ui,
        sans-serif;
      color: #302c26;
      background: #fbf8f1;
    }
    body {
      max-width: 90rem;
      margin: auto;
      padding: 2rem;
    }
    h1,
    h2 {
      font-weight: 600;
    }
    label {
      display: inline-block;
      margin: 0 1rem 1rem 0;
    }
    select,
    input,
    button {
      font: inherit;
      padding: 0.4rem;
      border: 1px solid #776e60;
      border-radius: 0.3rem;
      background: #fffdf8;
      color: inherit;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
    }
    th,
    td {
      text-align: left;
      padding: 0.55rem;
      border-bottom: 1px solid #b8ae9d;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th {
      background: #eee7da;
    }
    section {
      margin: 2rem 0;
    }
    .scroll {
      overflow: auto;
    }
    .scroll table {
      min-width: 42rem;
    }
    small,
    .muted {
      color: #61594d;
    }
    .cards {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .card {
      padding: 1rem;
      border: 1px solid #b8ae9d;
      border-radius: 0.4rem;
      min-width: 9rem;
    }
    .value {
      font-size: 1.4rem;
      font-weight: 600;
    }
    code {
      overflow-wrap: anywhere;
    }
    summary {
      cursor: pointer;
    }
    a {
      color: #365d86;
    }
    button:focus-visible,
    select:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 3px solid #365d86;
      outline-offset: 2px;
    }
    .bar {
      display: inline-block;
      background: #597a72;
      height: 0.7rem;
      min-width: 2px;
    }
    pre {
      white-space: pre-wrap;
    }
    @media (max-width: 40rem) {
      body {
        padding: 1rem;
      }
      th,
      td {
        padding: 0.3rem;
      }
    }
  </style>
  <h1>Keith’s project experiments</h1>
  <p>
    Private offline report. Measured events, annotated decisions and derived
    summaries are distinct. Missing measurements are
    <strong>unavailable</strong>.
  </p>
  <p id="generated"></p>
  <label
    >Increment
    <select id="increment">
      <option value="">All bounded increments</option>
    </select></label
  >
  <label
    >Session
    <select id="session">
      <option value="">All</option>
    </select></label
  >
  <label
    >Model
    <select id="model">
      <option value="">All</option>
    </select></label
  >
  <label
    >Comparison group
    <select id="group">
      <option value="">All</option>
    </select></label
  >
  <label
    >Task type
    <select id="task">
      <option value="">All</option>
    </select></label
  >
  <label
    >Recording run
    <select id="run">
      <option value="">All runs</option>
    </select></label
  >
  <button id="reset">Reset filters</button>
  <main id="report"></main>
  <script>
    'use strict';
    const data = /*DATA*/ null;
    const $ = (id) => document.getElementById(id);
    const esc = (value) =>
      String(value ?? 'unavailable').replace(
        /[&<>"']/g,
        (c) =>
          ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          })[c],
      );
    const fmt = (value) =>
      value == null ? 'unavailable' : Number(value).toLocaleString();
    const table = (heads, rows) =>
      `<div class="scroll"><table><thead><tr>${heads.map((h) => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map((row) => `<tr>${row.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${heads.length}">No observed records</td></tr>`}</tbody></table></div>`;
    const options = (id, values) =>
      [...new Set(values.filter(Boolean))].sort().forEach((value) => {
        const o = document.createElement('option');
        o.value = value;
        o.textContent = value;
        $(id).append(o);
      });
    options(
      'run',
      data.runs.map((r) => r.id),
    );
    options(
      'increment',
      data.increments.map((i) => i.id),
    );
    options(
      'session',
      data.sessions.map((s) => s.id),
    );
    options(
      'model',
      data.records
        .filter((r) => r.kind.startsWith('usage'))
        .map((r) => r.data.model),
    );
    options(
      'group',
      data.increments.map((i) => i.comparison_group),
    );
    options(
      'task',
      data.annotations
        .filter((a) => a.kind === 'experiment')
        .map((a) => a.data.task_type),
    );
    $('generated').textContent =
      `Generated ${data.generated}; collection status: ${data.status}. Re-run sync and report to refresh.`;
    function render() {
      const inc = $('increment').value,
        sid = $('session').value,
        model = $('model').value,
        group = $('group').value,
        task = $('task').value,
        runFilter = $('run').value;
      const increments = data.increments.filter(
        (i) =>
          (!inc || i.id === inc) && (!group || i.comparison_group === group),
      );
      const incs = new Set(increments.map((i) => i.id));
      const runs = data.runs.filter(
        (r) => incs.has(r.increment_id) && (!runFilter || r.id === runFilter),
      );
      const runIds = new Set(runs.map((r) => r.id));
      const members = new Set(
        data.admitted_turns
          .filter((t) => runIds.has(t.run_id))
          .map((t) => t.session_id),
      );
      const sessions = data.sessions.filter(
        (s) => members.has(s.id) && (!sid || s.id === sid),
      );
      const ids = new Set(sessions.map((s) => s.id));
      let records = data.records.filter(
        (r) => ids.has(r.session_id) && runIds.has(r.run_id),
      );
      const roleLabel = (session, run) => {
        const rows = data.roles.filter(
          (r) => r.session_id === session && (!run || r.run_id === run),
        );
        const r = rows.at(-1);
        return r ? `${r.label} (${r.runtime_id}; ${session})` : session;
      };
      let annotations = data.annotations.filter(
        (a) =>
          ((!inc && !group) || incs.has(a.increment_id)) &&
          (!sid || a.session_id === sid),
      );
      if (task) {
        const allowed = new Set(
          annotations
            .filter((a) => a.kind === 'experiment' && a.data.task_type === task)
            .map((a) => a.task),
        );
        annotations = annotations.filter((a) => allowed.has(a.task));
      }
      const usage = records.filter(
        (r) => r.kind.startsWith('usage') && (!model || r.data.model === model),
      );
      const sum = (k) =>
        usage.length && usage.every((r) => r.data[k] != null)
          ? usage.reduce((n, r) => n + r.data[k], 0)
          : null;
      const total = sum('total_tokens'),
        input = sum('input_tokens'),
        cached = sum('cached_input_tokens'),
        output = sum('output_tokens'),
        reasoning = sum('reasoning_output_tokens');
      const cards = [
        ['Observed total tokens', fmt(total)],
        ['Input', fmt(input)],
        ['Cached input (subset)', fmt(cached)],
        ['Output', fmt(output)],
        ['Reasoning output (subset)', fmt(reasoning)],
        ['Linked sessions', sessions.length],
        [
          'Cached input / input',
          input && cached != null
            ? ((cached / input) * 100).toFixed(1) + '%'
            : 'unavailable',
        ],
        [
          'Reasoning / output',
          output && reasoning != null
            ? ((reasoning / output) * 100).toFixed(1) + '%'
            : 'unavailable',
        ],
      ];
      let out = `<section aria-label="Resource summary"><div class="cards">${cards.map(([k, v]) => `<div class="card"><div>${esc(k)}</div><div class="value">${esc(v)}</div></div>`).join('')}</div><p>Tokens are measured; ratios are derived. Totals are observed coverage, not proof of complete accounting. Task-type filtering applies to annotations; task-level token allocation is unavailable.</p></section>`;
      out += `<section><h2>Recording runs and boundaries</h2><p>Default off. Legacy/unbounded records excluded: ${esc(data.legacy.excluded_records)}. Role labels are annotations; runtime identities are preserved.</p>${table(
        ['Run', 'Increment', 'State', 'Pending turns', 'Partial'],
        runs.map((r) => [
          r.id,
          r.increment_id,
          r.state,
          data.admitted_turns
            .filter((t) => t.run_id === r.id && !t.terminal && !t.partial)
            .map((t) => `${t.session_id}/${t.turn_id}`)
            .join('; ') || 'none',
          r.partial ? 'yes' : 'no',
        ]),
      )}${table(
        ['Window', 'Run', 'Opened', 'Admissions closed'],
        data.windows
          .filter((w) => runIds.has(w.run_id))
          .map((w) => [w.id, w.run_id, w.opened, w.closed ?? 'open']),
      )}
      ${table(
        ['Agent', 'Runtime identity', 'Role / label', 'Assigned'],
        data.roles
          .filter((r) => runIds.has(r.run_id))
          .map((r) => [
            r.session_id,
            r.runtime_id,
            `${r.role} / ${r.label}`,
            r.ts,
          ]),
      )}</section>`;
      out += `<section><h2>Coverage and tracker overhead</h2><ul>${data.coverage.map((g) => `<li>${esc(g)}</li>`).join('')}</ul><p>Last sync overhead (measured): ${esc(data.tracker_overhead?.duration_ms)} ms. Annotation effort requires an overhead annotation.</p>${table(
        ['Session', 'Source warning', 'Last sync'],
        data.sources
          .filter((s) => ids.has(s.session_id))
          .map((s) => [
            s.session_id,
            s.warning ?? 'No parser warning; completeness not guaranteed',
            s.last_sync,
          ]),
      )}</section>`;
      out += `<section><details><summary>Usage provenance and model configuration — measured</summary>${table(
        ['Session', 'Turn', 'Model', 'Effort', 'Total tokens', 'Method'],
        usage.map((r) => [
          r.session_id,
          r.turn_id,
          r.data.model,
          r.data.effort,
          fmt(r.data.total_tokens),
          r.data.method,
        ]),
      )}</details></section>`;
      const lifecycle = records.filter(
        (r) =>
          r.kind === 'lifecycle' ||
          r.kind === 'compaction' ||
          (r.kind === 'hook' &&
            [
              'SessionStart',
              'SessionEnd',
              'SubagentStart',
              'SubagentStop',
              'Stop',
              'Interrupt',
              'PreCompact',
              'PostCompact',
            ].includes(r.data.hook_event_name)),
      );
      out += `<section><h2>Agent timeline — measured lifecycle and annotated waits</h2>${table(
        ['Session / parent', 'Timestamp', 'Event'],
        lifecycle.map((r) => [
          roleLabel(r.session_id, r.run_id) +
            ' / ' +
            (sessions.find((s) => s.id === r.session_id)?.parent ??
              'main/unknown'),
          r.ts,
          r.data.event ?? r.data.hook_event_name ?? r.kind,
        ]),
      )}${table(
        ['Agent', 'Task', 'Explicit blocked seconds'],
        data.blocked_intervals
          .filter(
            (w) =>
              ((!inc && !group) || incs.has(w.increment_id)) &&
              (!sid || w.session_id === sid),
          )
          .map((w) => [w.agent, w.task, w.seconds]),
      )}<p>Lifecycle spans are not active work. Silence is not idle time.</p></section>`;
      const tools = records.filter((r) => r.kind === 'tool');
      const posts = records.filter(
        (r) => r.kind === 'hook' && r.data.hook_event_name === 'PostToolUse',
      );
      const pres = records.filter(
        (r) => r.kind === 'hook' && r.data.hook_event_name === 'PreToolUse',
      );
      out += `<section><h2>Tools and request attempts — measured</h2>${table(
        ['Session', 'Tool', 'Outcome', 'Duration ms'],
        posts.map((r) => {
          const pre = pres.find(
            (p) =>
              p.session_id === r.session_id &&
              p.data.tool_use_id === r.data.tool_use_id,
          );
          return [
            r.session_id,
            r.data.tool_name,
            r.data.exit_code != null
              ? 'exit ' + r.data.exit_code
              : r.data.is_error === true
                ? 'failed'
                : (r.data.status ?? 'unavailable'),
            pre
              ? Math.max(0, Date.parse(r.ts) - Date.parse(pre.ts))
              : 'unavailable',
          ];
        }),
      )}${table(
        ['Session', 'Model', 'Request status'],
        records
          .filter(
            (r) =>
              r.kind === 'hook' &&
              r.data.hook_event_name === 'PostModelRequest',
          )
          .map((r) => [r.session_id, r.data.model, r.data.status]),
      )}<details><summary>Repeated tool-name candidates (${tools.length} observed calls)</summary><pre>${esc(JSON.stringify(data.repeated_tool_candidates, null, 2))}</pre></details><p>Repeated names do not prove repeated analysis or unnecessary work.</p></section>`;
      out += `<section><h2>Coordination checks — annotated evidence</h2>${table(
        ['Rule', 'Agent / file / annotation', 'Result'],
        data.coordination_checks
          .filter((c) => (!inc && !group) || incs.has(c.increment_id))
          .map((c) => [c.rule, c.agent ?? c.file ?? c.annotation, c.result]),
      )}</section>`;
      out += `<section><h2>Experiment comparison — descriptive, no causal savings claim</h2>${table(
        [
          'Increment',
          'Group',
          'Hypothesis',
          'Observed tokens',
          'Acceptance / confounders',
        ],
        increments.map((i) => {
          const iruns = new Set(
            runs.filter((r) => r.increment_id === i.id).map((r) => r.id),
          );
          const u = usage.filter((r) => iruns.has(r.run_id));
          const tok =
            u.length && u.every((r) => r.data.total_tokens != null)
              ? u.reduce((n, r) => n + r.data.total_tokens, 0)
              : null;
          return [
            i.id,
            i.comparison_group || 'unassigned',
            i.hypothesis,
            fmt(tok),
            data.annotations
              .filter(
                (a) =>
                  a.increment_id === i.id &&
                  ['acceptance', 'experiment'].includes(a.kind),
              )
              .map((a) => a.data.outcome ?? a.data.confounders ?? 'unavailable')
              .join('; ') || 'unavailable',
          ];
        }),
      )}</section>`;
      out += `<section><h2>Decisions, context, reviews and handoffs — annotated</h2>${table(
        ['Time', 'Kind / task', 'Agent', 'Redacted summary / evidence'],
        annotations.map((a) => [
          a.ts,
          a.kind + ' / ' + (a.task ?? 'unassigned'),
          a.agent,
          JSON.stringify(a.data),
        ]),
      )}</section>`;
      $('report').innerHTML = out;
    }
    for (const id of ['increment', 'session', 'model', 'group', 'task', 'run'])
      $(id).addEventListener('change', render);
    $('reset').addEventListener('click', () => {
      for (const id of [
        'increment',
        'session',
        'model',
        'group',
        'task',
        'run',
      ])
        $(id).value = '';
      render();
    });
    render();
  </script>
</html>
